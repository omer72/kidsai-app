<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kidsit AI — Parental Guidance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #E8ECF3;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden; height: 100%;
    overscroll-behavior: none; -webkit-overflow-scrolling: auto;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; width: 100%; }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  #root { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
  button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button:focus { outline: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes pg-ring {
    0%   { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  @keyframes pg-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes pg-breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }
  @keyframes pg-drift {
    0%   { transform: translate(-8%, -6%) scale(1); opacity: 0.55; }
    50%  { transform: translate(6%, 4%) scale(1.08); opacity: 0.75; }
    100% { transform: translate(-8%, -6%) scale(1); opacity: 0.55; }
  }
  @keyframes pg-fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RTL ─────────────────────────────────────────────────────────── */
  html[dir="rtl"] body { direction: rtl; text-align: right; }

  /* Default text alignment for content inside an RTL document.
     Components that hard-code text-align: 'left'/'right' in inline
     styles will still override this — that's intentional. */
  html[dir="rtl"] input,
  html[dir="rtl"] textarea,
  html[dir="rtl"] [contenteditable="true"] {
    text-align: right;
  }

  /* Directional-arrow icons (Icon.ArrowRight etc.) inside an RTL
     document get visually mirrored so they point in the correct
     reading-flow direction (right→left becomes →start). */
  html[dir="rtl"] [data-flip-rtl="true"],
  html[dir="rtl"] svg[data-arrow="right"],
  html[dir="rtl"] svg[data-arrow="left"],
  html[dir="rtl"] svg[data-arrow="chevron"],
  html[dir="rtl"] svg[data-arrow="back"] {
    transform: scaleX(-1);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
